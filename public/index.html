<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おつかいAI — 言うだけ・撮るだけで買い物</title>
<meta name="otsukai-api" content="">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#e8590c">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#222; --sub:#777; --line:#e8e2d8; --accent:#e8590c; --ok:#2b8a3e; --warn:#e67700; --ng:#c92a2a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:2; }
  header h1 { font-size:18px; margin:0; }
  header h1 span { color:var(--accent); }
  header button { background:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:13px; }
  #log { max-width:680px; margin:0 auto; padding:16px 16px 120px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .ai { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .products { display:flex; gap:10px; overflow-x:auto; padding:2px 0 6px; }
  .p { flex:0 0 170px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px; font-size:12px; }
  .p img { width:100%; aspect-ratio:1; object-fit:contain; background:#f3f3f3; border-radius:8px; }
  .p .n { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; margin:6px 0 4px; }
  .p .pr { font-weight:700; font-size:15px; }
  .p .s { color:var(--sub); }
  .p .st { display:inline-block; margin-top:6px; font-size:10px; padding:1px 6px; border-radius:999px; background:#f1ece4; color:#555; }
  .buy { background:var(--card); border:2px solid var(--ok); border-radius:12px; padding:12px; font-size:14px; }
  .buy a { display:block; text-align:center; margin-top:8px; background:var(--ok); color:#fff; text-decoration:none; padding:12px; border-radius:10px; font-weight:700; }
  .hint { color:var(--sub); font-size:12px; }
  .buy img { width:72px; height:72px; object-fit:contain; float:left; margin-right:10px; border-radius:8px; background:#f3f3f3; }
  form#f { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); padding:10px; display:flex; gap:8px; justify-content:center; }
  form#f textarea { flex:1; max-width:600px; resize:none; border:1px solid var(--line); border-radius:12px; padding:10px; font:inherit; height:46px; }
  form#f button { background:var(--accent); color:#fff; border:0; border-radius:12px; padding:0 18px; font-weight:700; cursor:pointer; }
  form#f button:disabled { opacity:.5; }
  #cam { display:flex; align-items:center; justify-content:center; width:46px; border:1px solid var(--line); border-radius:12px; font-size:22px; cursor:pointer; background:var(--card); }
  #pv { position:relative; }
  #pv img { height:46px; width:46px; object-fit:cover; border-radius:10px; }
  #pv button { position:absolute; top:-6px; right:-6px; width:20px; height:20px; padding:0; border-radius:50%; background:#333; font-size:12px; line-height:20px; }
  .photo { align-self:flex-end; max-width:160px; border-radius:12px; border:1px solid var(--line); }
  .pr { text-align:center; color:var(--sub); font-size:11px; padding:4px 0 0; }
  .welcome { text-align:center; color:var(--sub); padding:30px 10px; line-height:1.8; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
  .chips button { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>おつかい<span>AI</span></h1>
  <div>
    <button id="newBtn">新しい買い物</button>
  </div>
</header>

<main id="log"></main>
<p class="pr" id="prNote" hidden>※ このアプリの商品リンクには楽天アフィリエイト・Amazonアソシエイトを使っています(PR)。Amazonのアソシエイトとして、当アプリは適格販売により収入を得ています</p>

<form id="f">
  <div id="pv" hidden><img id="pvImg" alt=""><button type="button" id="pvX" aria-label="写真を外す">×</button></div>
  <label id="cam" title="写真から探す">📷<input id="file" type="file" accept="image/*" hidden></label>
  <textarea id="q" placeholder="例: 2000円以内でコーヒー豆を買って / 📷で写真から探す"></textarea>
  <button id="send">送る</button>
</form>

<script>
const $ = (s) => document.querySelector(s);
// スマホアプリ(Capacitor)の中ではサーバーが別の場所にあるので、そのURLを使う。Webでは同じ場所
const API = ($('meta[name="otsukai-api"]')?.content || "").replace(/\/$/, "");
const NATIVE = !!window.Capacitor?.isNativePlatform?.();
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let state = store.get("otsukai.state", null) || fresh();
function fresh() { return { id: crypto.randomUUID(), messages: [], view: [] }; }
function save() { store.set("otsukai.state", state); }

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const postage = (it) => it.postage_included === true ? "送料込" : it.postage_included === false ? "送料別" : "送料は注文画面で";
const yen = (n) => "¥" + Number(n).toLocaleString("ja-JP");

function render() {
  const log = $("#log"); log.innerHTML = "";
  if (!state.view.length) {
    const w = el("div", "welcome");
    w.append(el("div", null, "欲しいものを言うだけ。AIが楽天市場とAmazonから探して、注文画面まで案内します。"), el("div", null, "📷 切れた洗剤や、SNSで見かけた物のスクショを送れば、同じ物を探します。"), el("div", null, "スマホはホーム画面に追加すると、スクショの「共有」からすぐ頼めます。"));
    const c = el("div", "chips");
    ["2000円以内でコーヒー豆を買って", "トイレットペーパーの安いやつ", "1000円くらいのプレゼント用ハンドクリーム"].forEach((t) => {
      const b = el("button", null, t); b.type = "button"; b.onclick = () => { $("#q").value = t; $("#q").focus(); }; c.append(b);
    });
    w.append(c); log.append(w);
  }
  state.view.forEach((v) => log.append(draw(v)));
  $("#prNote").hidden = !state.view.some((v) => v.kind === "products" || v.kind === "checkout");
  window.scrollTo(0, document.body.scrollHeight);
}

function draw(v) {
  if (v.kind === "user") return el("div", "msg user", v.text);
  if (v.kind === "photo") { const im = el("img", "photo"); im.src = v.thumb; im.alt = "送った写真"; return im; }
  if (v.kind === "ai") return el("div", "msg ai", v.text);
  if (v.kind === "products") {
    const row = el("div", "products");
    v.items.forEach((it) => {
      const card = el("a", "p"); card.href = it.url; card.target = "_blank"; card.rel = "noopener sponsored"; card.style.color = "inherit"; card.style.textDecoration = "none";
      if (it.image) { const im = el("img"); im.src = it.image; im.alt = ""; im.loading = "lazy"; card.append(im); }
      if (it.store) card.append(el("div", "st", it.store));
      card.append(el("div", "n", it.name), el("div", "pr", yen(it.price)), el("div", "s", postage(it) + " ・ " + it.shop));
      if (it.review?.count) card.append(el("div", "s", "★" + it.review.average + "(" + it.review.count + "件)"));
      row.append(card);
    });
    return row;
  }
  if (v.kind === "checkout") {
    const box = el("div", "buy");
    if (v.item.image) { const im = el("img"); im.src = v.item.image; im.alt = ""; box.append(im); }
    box.append(el("div", null, `🛒 合計 ${yen(v.amount)}`), el("div", "hint", v.item.name + " ×" + v.qty + "(" + postage(v.item) + ")"));
    const store = v.item.store || "楽天市場";
    const a = el("a", null, store + "で注文する"); a.href = v.url; a.target = "_blank"; a.rel = "noopener sponsored";
    box.append(a, el("div", "hint", store + "の画面で内容を確かめてから注文を確定してください。"));
    return box;
  }
  return el("div");
}

// 写真は送る前にブラウザで縮小する(長辺1280px・JPEG)。履歴には小さなサムネイルだけ残す
async function shrink(file, max, quality) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", quality);
}
let photo = null; // { data, thumb }
async function setPhoto(f) {
  try {
    photo = { data: await shrink(f, 1280, 0.85), thumb: await shrink(f, 240, 0.7) };
    $("#pvImg").src = photo.thumb; $("#pv").hidden = false; $("#q").focus();
    return true;
  } catch { alert("この写真は読み込めませんでした。"); return false; }
}
$("#file").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (f) setPhoto(f);
};
// パソコンでは スクショ → Ctrl+V(⌘V)で貼り付けられる
document.addEventListener("paste", (e) => {
  const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith("image/"));
  if (f) { e.preventDefault(); setPhoto(f); }
});
// スマホでは スクショ → 共有 → おつかいAI で、開いた瞬間にAIへ送る
async function takeShared() {
  if (!new URLSearchParams(location.search).has("shared")) return;
  history.replaceState(null, "", "/");
  try {
    const cache = await caches.open("otsukai-share");
    const [pr, tr] = await Promise.all([cache.match("/shared/photo"), cache.match("/shared/text")]);
    await Promise.all([cache.delete("/shared/photo"), cache.delete("/shared/text")]);
    const text = tr ? (await tr.text()).slice(0, 500) : "";
    if (pr && await setPhoto(await pr.blob())) {
      if (text) $("#q").value = text;
      $("#f").requestSubmit();
    } else if (text) { $("#q").value = text; }
  } catch {}
}
if (!NATIVE && "serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
// スマホアプリ: スクショを「共有」→ おつかいAI で、写真を受け取ってすぐAIへ送る
if (NATIVE) {
  try {
    const share = window.Capacitor.registerPlugin("CapacitorShareTarget");
    share.addListener("shareReceived", async (e) => {
      const f = (e.files || []).find((x) => (x.mimeType || "").startsWith("image/"));
      const text = (e.texts || []).join(" ").trim().slice(0, 500);
      if (f) {
        const src = f.uri.startsWith("data:") ? f.uri : window.Capacitor.convertFileSrc(f.uri);
        const blob = await (await fetch(src)).blob();
        if (await setPhoto(blob)) { if (text) $("#q").value = text; $("#f").requestSubmit(); }
      } else if (text) { $("#q").value = text; }
    });
  } catch {}
}
$("#pvX").onclick = () => { photo = null; $("#pv").hidden = true; };

async function ask(text, hidden, img) {
  if (img) {
    const content = [{ type: "image", source: { type: "base64", media_type: "image/jpeg", data: img.data.split(",")[1] } }, { type: "text", text }];
    state.messages.push({ role: "user", content });
    state.view.push({ kind: "photo", thumb: img.thumb });
    if (text !== PHOTO_DEFAULT) state.view.push({ kind: "user", text });
  } else {
    state.messages.push({ role: "user", content: text });
    if (!hidden) state.view.push({ kind: "user", text });
  }
  save(); render(); busy(true);
  const thinking = el("div", "msg ai", "…"); $("#log").append(thinking);
  try {
    const r = await fetch(API + "/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ messages: state.messages }) });
    const d = await r.json();
    // 画面用の出来事(商品カード・注文ボタン)を、AIの文の前に並べる
    (d.events || []).forEach((e) => state.view.push(e.type === "products" ? { kind: "products", items: e.items } : { kind: e.type, ...e }));
    (d.messages || []).forEach((m) => {
      state.messages.push(m);
      if (m.role === "assistant") { const t = m.content.filter((b) => b.type === "text").map((b) => b.text).join("\n").trim(); if (t) state.view.push({ kind: "ai", text: t }); }
    });
    if (d.error) state.view.push({ kind: "ai", text: "エラーが起きました: " + (d.message || d.error) });
    if (d.error && !(d.messages || []).length) state.messages.pop();
  } catch (e) {
    state.messages.pop();
    state.view.push({ kind: "ai", text: "通信できませんでした。もう一度送ってください。" });
  } finally {
    // 大きな写真データは一度AIに見せたら履歴から外す(保存容量と通信量のため)
    state.messages = state.messages.map((m) => Array.isArray(m.content) && m.role === "user"
      ? { ...m, content: m.content.map((c) => c.type === "image" ? { type: "text", text: "(ユーザーが写真を送った)" } : c) } : m);
    save(); busy(false); render();
  }
}
const PHOTO_DEFAULT = "この写真のものを探して";

function busy(b) { $("#send").disabled = b; $("#q").disabled = b; }
$("#newBtn").onclick = () => { state = fresh(); save(); render(); };
$("#f").onsubmit = (e) => {
  e.preventDefault();
  const t = $("#q").value.trim();
  if (!t && !photo) return;
  const img = photo; photo = null; $("#pv").hidden = true; $("#q").value = "";
  ask(t || PHOTO_DEFAULT, false, img);
};
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#f").requestSubmit(); } });
render();
takeShared();
</script>
</body>
</html>
